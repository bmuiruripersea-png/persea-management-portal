<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Persea Inspections</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1220">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inspections">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
html,body{margin:0;height:100%;background:#0b1220;color:#e5eaf3;font:14px 'Segoe UI',Arial,sans-serif}
iframe{border:0;width:100%;height:100%;display:block}
.msg{max-width:520px;margin:12vh auto;padding:0 20px;line-height:1.5}
.msg code{background:#131c2e;padding:2px 6px;border-radius:4px}
</style></head><body>
<script>
/* ====== SET THESE TWO LINES ====== */
const DASHBOARD_URL = 'https://script.google.com/macros/s/AKfycbwZx9v2oWO6ZNH1maZ9Z7wy5ARyfkjuooRvBr3mT6B8EoauufZIRsYpFXQcWU4VcPhT/exec';  // the Apps Script web app link ending in /exec
const MODE = 'iframe';  // 'iframe' = dashboard opens inside the app window.
                        // 'redirect' = use this if the iframe shows a Google sign-in error.
/* ================================= */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
if (DASHBOARD_URL.indexOf('https://') !== 0) {
  document.body.innerHTML = '<div class="msg"><h2>Almost there</h2><p>Open <code>index.html</code> in a text editor and paste your dashboard link (the one ending in <code>/exec</code>) into <code>DASHBOARD_URL</code>, then upload the files again.</p></div>';
} else if (MODE === 'redirect') {
  location.replace(DASHBOARD_URL);
} else {
  const f = document.createElement('iframe');
  f.src = DASHBOARD_URL;
  f.allow = 'fullscreen';
  document.body.appendChild(f);
}
</script>
</body></html>
